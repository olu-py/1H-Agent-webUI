name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: TypeScript typecheck
        working-directory: web
        run: pnpm typecheck
      - name: Unit tests
        working-directory: web
        run: pnpm test
      - name: Build bundle (embeds into the Rust binary)
        working-directory: web
        run: pnpm build
      - name: Verify committed dist is current
        run: git diff --exit-code -- web/dist

  quality:
    name: Linux quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agent documentation
        run: bash scripts/check-agent-docs.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libdbus-1-dev pkg-config
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --quiet --all-features --locked
      - name: TS bindings drift check
        run: bash scripts/core-bindings.sh check
      - name: Release build
        run: cargo build --release --locked

  platform-tests:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --quiet --all-features --locked
