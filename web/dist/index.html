<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1H-Agent</title>
    <!-- Theme bootstrap: resolve the stored preference (auto/light/dark) and
         set <html data-theme> before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("1h-theme") || "auto";
          var theme = stored;
          if (theme === "auto") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
