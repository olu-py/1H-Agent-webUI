[workspace]
resolver = "2"
members = ["crates/1h-agent-web"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
description = "A lightweight, permission-aware multi-interface agent for Linux, macOS, and Windows"
authors = ["olu"]
license-file = "LICENSE"
repository = "https://github.com/olu-py/1H-Agent-webUI"

[workspace.dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1", "query"] }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
fs2 = "0.4"
futures-util = "0.3"
globset = "0.4"
html2text = "0.15"
ignore = "0.4"
keyring = { version = "3", default-features = false }
libc = "0.2"
mime_guess = "2"
rand = "0.8"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rust-embed = { version = "8", features = ["debug-embed", "include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time", "io-util", "net"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
ts-rs = { version = "12", features = ["serde-json-impl"] }
protium-core = { git = "https://github.com/olu-py/1H-Agent-core.git", branch = "main" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
